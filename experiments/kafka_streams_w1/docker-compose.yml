services:
  kafka-1:
    image: apache/kafka:4.3.1
    container_name: stream-state-bench-kstreams-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_FLUSH_MESSAGES: "1"
      KAFKA_FLUSH_MS: "0"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  kafka-2:
    image: apache/kafka:4.3.1
    container_name: stream-state-bench-kstreams-kafka-2
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_FLUSH_MESSAGES: "1"
      KAFKA_FLUSH_MS: "0"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  kafka-3:
    image: apache/kafka:4.3.1
    container_name: stream-state-bench-kstreams-kafka-3
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_FLUSH_MESSAGES: "1"
      KAFKA_FLUSH_MS: "0"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  kafka-streams-identity:
    build:
      context: .
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      APPLICATION_ID: "${APPLICATION_ID:-stream-state-bench-w1-identity}"
      INPUT_TOPIC: "${INPUT_TOPIC:-bench-w1-input}"
      LEFT_INPUT_TOPIC: "${LEFT_INPUT_TOPIC:-bench-w5-left-input}"
      RIGHT_INPUT_TOPIC: "${RIGHT_INPUT_TOPIC:-bench-w5-right-input}"
      OUTPUT_TOPIC: "${OUTPUT_TOPIC:-bench-w1-output}"
      WORKLOAD: "${WORKLOAD:-identity}"
      COMMIT_INTERVAL_MS: "${COMMIT_INTERVAL_MS:-1000}"
      CACHE_MAX_BYTES: "${CACHE_MAX_BYTES:-10485760}"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
